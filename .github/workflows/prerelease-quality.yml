name: Prerelease quality

on:
  pull_request:
    branches:
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Run type check
        run: npm run typecheck
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run build
        run: npm run build
      - name: Verify npm package
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm run test:package --if-present
