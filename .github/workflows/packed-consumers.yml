name: Packed consumers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-consumers:
    name: Native Markdown-it ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ['12', '13', '14', '15']
    env:
      PACKED_CONSUMER_REPORT_DIR: ${{ runner.temp }}/directive-packed-reports
    steps:
      - uses: actions/checkout@v5
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: '24'
      - name: Build, pack and validate an independent consumer
        run: npm run test:packed -- ${{ matrix.host }}
      - name: Upload packed consumer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: directive-packed-native${{ matrix.host }}
          path: ${{ runner.temp }}/directive-packed-reports
          retention-days: 7
